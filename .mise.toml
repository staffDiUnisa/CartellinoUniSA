[tools]
python = "3.12"
uv = "latest"

[tasks.install]
description = "Installa le dipendenze del progetto"
run = "uv sync"

[tasks.app]
description = "Esegue lo script principale (cartellino_v2.py)"
run = "uv run python cartellino_v2.py"

[tasks.tui]
description = "Esegue la TUI Textual (cartellino_tui.py)"
run = "uv run python cartellino_tui.py"

[tasks.gui]
description = "Esegue la GUI desktop PySide6 (cartellino_gui.py, spike Fase 0 TODO_gui.md)"
run = "uv run python cartellino_gui.py"
