name: Release

# Fase 6 TODO.md: build multipiattaforma degli eseguibili standalone della TUI
# (PyInstaller, packaging/cartellino.spec) e pubblicazione su GitHub Release.
# Trigger: push di un tag `v2.*` (es. v2.0.0).
#
# Oltre agli zip onedir "grezzi" (storici), il job build produce anche un vero
# installer per OS: .pkg firmato/notarizzato/staplato su macOS, setup.exe
# (Inno Setup, non firmato) su Windows, .deb/.rpm (fpm) su Linux. Vedi
# CLAUDE.md § Packaging per i dettagli.

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: cartellino-unisa-macos
          - os: ubuntu-latest
            asset_name: cartellino-unisa-linux
          - os: windows-latest
            asset_name: cartellino-unisa-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Estrae la versione dal tag (es. v2.0.0 -> 2.0.0)
        # Usata da pkgbuild/ISCC/fpm per il numero di versione degli installer
        # nativi: più affidabile che leggerla da pyproject.toml, dato che il
        # bump versione precede sempre il tag per convenzione del progetto.
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v4

      - name: Installa le dipendenze (incluso il gruppo build per PyInstaller)
        run: uv sync --group build

      - name: "Build eseguibile standalone (onedir: dist/cartellino-unisa/)"
        run: uv run pyinstaller packaging/cartellino.spec --noconfirm

      - name: Importa il certificato Developer ID in un keychain temporaneo (solo macOS)
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode -o certificate.p12
          security create-keychain -p actions-runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions-runner build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions-runner build.keychain
          rm -f certificate.p12

      - name: Firma tutte le librerie native e l'eseguibile (solo macOS)
        # `--deep` su `codesign` non attraversa una cartella onedir "piatta" come
        # quella prodotta da PyInstaller (non è un vero bundle/framework): vanno
        # firmate esplicitamente tutti i Mach-O prima dell'eseguibile che li usa.
        # Filtrare solo per estensione (*.so/*.dylib) non basta: alcuni pacchetti
        # (es. selenium, con `selenium-manager`) includono binari nativi senza
        # estensione — vanno rilevati con `file` guardando il contenuto reale.
        if: matrix.os == 'macos-latest'
        run: |
          find dist/cartellino-unisa -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime \
                --entitlements packaging/entitlements.plist \
                --sign "Developer ID Application" "$f"
            fi
          done
          codesign --force --timestamp --options runtime \
            --entitlements packaging/entitlements.plist \
            --sign "Developer ID Application" \
            dist/cartellino-unisa/cartellino-unisa
          codesign --verify --deep --strict --verbose=2 dist/cartellino-unisa/cartellino-unisa

      - name: Genera e firma il launcher .app (solo macOS)
        # Compilato da un sorgente AppleScript versionato (non committiamo un
        # .app binario: diff illeggibili, specifico della versione Xcode/OS
        # del runner). `osacompile` produce un vero Mach-O
        # (Contents/MacOS/applet), firmabile con lo stesso identity Developer
        # ID Application della CLI, ma con un file di entitlements dedicato
        # (packaging/macos/launcher-entitlements.plist, non quello della CLI):
        # sotto hardened runtime, inviare un Apple Event (`tell application
        # "Terminal"`) richiede l'entitlement
        # com.apple.security.automation.apple-events, altrimenti fallisce con
        # "Not authorised to send Apple events... (-1743)" anche dopo il
        # consenso dell'utente nel prompt di Automazione (riscontrato in
        # produzione sulla v2.0.2-rc1). L'Info.plist di default di osacompile
        # ha un identifier generico (com.apple.ScriptEditor.id.*) e nessuna
        # versione: va patchato con PlistBuddy prima della firma, dato che
        # pkgbuild non firma il payload, solo l'installer package.
        if: matrix.os == 'macos-latest'
        run: |
          osacompile -o "build/Cartellino UniSA.app" packaging/macos/launcher.applescript

          PLIST="build/Cartellino UniSA.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier org.antaresnet.cartellino-unisa.launcher" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string org.antaresnet.cartellino-unisa.launcher" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Cartellino UniSA" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleName string Cartellino UniSA" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Cartellino UniSA" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Cartellino UniSA" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.value }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${{ steps.version.outputs.value }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.value }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ steps.version.outputs.value }}" "$PLIST"

          codesign --force --timestamp --options runtime \
            --entitlements packaging/macos/launcher-entitlements.plist \
            --sign "Developer ID Application" \
            "build/Cartellino UniSA.app"
          codesign --verify --deep --strict --verbose=2 "build/Cartellino UniSA.app"

      - name: Notarizza e staple il launcher .app (solo macOS)
        # A differenza dell'eseguibile CLI sciolto (non staplabile), l'.app È
        # un formato supportato dallo stapler: un'app avviata con doppio
        # click da Finder non ha un contesto terminale che mostrerebbe un
        # eventuale errore di verifica online, va quindi resa verificabile
        # offline fin dal primo lancio — stessa ragione per cui il .pkg
        # stesso viene staplato più sotto.
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "build/Cartellino UniSA.app" notarize_app.zip
          xcrun notarytool submit notarize_app.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee notarize_app_result.json
          submission_id=$(jq -r '.id' notarize_app_result.json)
          status=$(jq -r '.status' notarize_app_result.json)
          echo "Notarizzazione .app: status=$status id=$submission_id"
          if [ "$status" != "Accepted" ]; then
            echo "--- Log dettagliato Apple (xcrun notarytool log) ---"
            xcrun notarytool log "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Notarizzazione .app non accettata da Apple (status: $status) — vedi il log sopra"
            exit 1
          fi
          rm -f notarize_app.zip notarize_app_result.json

          xcrun stapler staple "build/Cartellino UniSA.app"

      - name: Notarizza presso Apple (solo macOS)
        # `notarytool submit --wait` esce con codice 0 anche se Apple rifiuta la
        # richiesta (status "Invalid") — riflette solo "l'operazione CLI è
        # andata a buon fine", non l'esito della notarizzazione. Va controllato
        # esplicitamente lo status nel JSON, altrimenti uno step "verde" può
        # nascondere un binario NON notarizzato.
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/cartellino-unisa notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee notarize_result.json
          submission_id=$(jq -r '.id' notarize_result.json)
          status=$(jq -r '.status' notarize_result.json)
          echo "Notarizzazione: status=$status id=$submission_id"
          echo "--- Log dettagliato Apple (xcrun notarytool log) ---"
          xcrun notarytool log "$submission_id" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
          rm -f notarize.zip notarize_result.json
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarizzazione non accettata da Apple (status: $status) — vedi il log sopra"
            exit 1
          fi

      # Niente stapling sull'eseguibile grezzo: `xcrun stapler staple` non
      # supporta un eseguibile "sciolto" come questo (non è un .app/.pkg/.dmg —
      # verificato: risponde "Stapler is incapable of working with Document
      # files"), quindi fallirebbe sempre. La notarizzazione resta comunque
      # valida senza stapling: Gatekeeper fa una verifica online al primo
      # avvio invece che offline. Il `.pkg` costruito sotto, invece, È un
      # formato supportato dallo stapler (vedi step dedicato).

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/cartellino-unisa/
          if-no-files-found: error

      - name: Importa il certificato "Developer ID Installer" (solo macOS)
        if: matrix.os == 'macos-latest'
        env:
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode -o installer_certificate.p12
          security import installer_certificate.p12 -k build.keychain -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple:,pkgbuild: -s -k actions-runner build.keychain
          rm -f installer_certificate.p12

      - name: "Costruisce, firma e notarizza il .pkg (solo macOS)"
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x packaging/macos/postinstall

          # Root sintetizzato: pkgbuild accetta una sola coppia
          # --root/--install-location, quindi CLI e launcher .app vengono
          # staged qui insieme per finire nello stesso .pkg (installazione
          # sempre congiunta, nessuno scenario di install indipendente che
          # giustifichi due componenti + productbuild).
          mkdir -p pkgroot/usr/local/cartellino-unisa
          mkdir -p pkgroot/Applications
          cp -R dist/cartellino-unisa/. pkgroot/usr/local/cartellino-unisa/
          cp -R "build/Cartellino UniSA.app" "pkgroot/Applications/Cartellino UniSA.app"

          pkgbuild \
            --root pkgroot \
            --install-location / \
            --scripts packaging/macos \
            --identifier org.antaresnet.cartellino-unisa \
            --version "${{ steps.version.outputs.value }}" \
            --sign "Developer ID Installer" \
            cartellino-unisa.pkg

          xcrun notarytool submit cartellino-unisa.pkg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee notarize_pkg_result.json
          submission_id=$(jq -r '.id' notarize_pkg_result.json)
          status=$(jq -r '.status' notarize_pkg_result.json)
          echo "Notarizzazione .pkg: status=$status id=$submission_id"
          if [ "$status" != "Accepted" ]; then
            echo "--- Log dettagliato Apple (xcrun notarytool log) ---"
            xcrun notarytool log "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Notarizzazione .pkg non accettata da Apple (status: $status) — vedi il log sopra"
            exit 1
          fi
          rm -f notarize_pkg_result.json

          # A differenza dell'eseguibile sciolto, il .pkg è un formato
          # supportato dallo stapler: permette verifica offline del ticket
          # di notarizzazione.
          xcrun stapler staple cartellino-unisa.pkg

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'macos-latest'
        with:
          name: cartellino-unisa-macos-pkg
          path: cartellino-unisa.pkg
          if-no-files-found: error

      - name: Installa Inno Setup (solo Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: "Costruisce l'installer .exe (solo Windows, non firmato)"
        # Vedi ignored/signed_windows.md (non versionato) per le opzioni
        # valutate per aggiungere la firma in futuro.
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss /DMyAppVersion=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: cartellino-unisa-windows-installer
          path: packaging/windows/Output/cartellino-unisa-setup.exe
          if-no-files-found: error

      - name: Installa fpm e le dipendenze per .deb/.rpm (solo Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev build-essential
          # Il gem di sistema (/var/lib/gems) non è scrivibile dall'utente
          # non privilegiato del runner: serve sudo, non un `gem install` liscio.
          sudo gem install --no-document fpm

      - name: Costruisce i pacchetti .deb e .rpm (solo Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x packaging/linux/postinstall.sh
          VERSION="${{ steps.version.outputs.value }}"

          fpm -s dir -t deb -f -n cartellino-unisa -v "$VERSION" \
            --after-install packaging/linux/postinstall.sh \
            --description "Gestione cartellino presenze UniSA" \
            --maintainer "staffDiUnisa" \
            --license "GPL-3.0" \
            --url "https://github.com/staffDiUnisa/CartellinoUniSA" \
            dist/cartellino-unisa/=/opt/cartellino-unisa/

          fpm -s dir -t rpm -f -n cartellino-unisa -v "$VERSION" \
            --after-install packaging/linux/postinstall.sh \
            --description "Gestione cartellino presenze UniSA" \
            --maintainer "staffDiUnisa" \
            --license "GPL-3.0" \
            --url "https://github.com/staffDiUnisa/CartellinoUniSA" \
            dist/cartellino-unisa/=/opt/cartellino-unisa/

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: cartellino-unisa-linux-deb
          path: "*.deb"
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: cartellino-unisa-linux-rpm
          path: "*.rpm"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Comprime le cartelle onedir e copia gli installer nativi già pronti
        # I job di build girano anche su windows-latest, dove `zip` non è
        # disponibile in Git Bash: la compressione va fatta qui (ubuntu-latest,
        # `zip` sempre presente), non nei job di build. Gli installer nativi
        # (.pkg/.exe/.deb/.rpm) sono invece già file singoli pronti alla
        # pubblicazione: vanno solo copiati, non ri-zippati.
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            case "$name" in
              cartellino-unisa-macos-pkg|cartellino-unisa-windows-installer|cartellino-unisa-linux-deb|cartellino-unisa-linux-rpm)
                find "$dir" -type f -exec cp {} release/ \;
                ;;
              *)
                # actions/upload-artifact + download-artifact non preservano
                # sempre il bit +x sui binari Unix (macOS/Linux): va
                # ripristinato prima di comprimere, altrimenti chi scarica lo
                # zip deve fare chmod a mano.
                if [ -f "$dir/cartellino-unisa" ]; then
                  chmod +x "$dir/cartellino-unisa"
                fi
                (cd "$dir" && zip -r "../../release/${name}.zip" .)
                ;;
            esac
          done
          ls -la release

      - name: Crea la GitHub Release con i binari allegati
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: true
