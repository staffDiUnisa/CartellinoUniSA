name: Release

# Fase 6 TODO.md: build multipiattaforma degli eseguibili standalone della TUI
# (PyInstaller, packaging/cartellino.spec) e pubblicazione su GitHub Release.
# Trigger: push di un tag `v2.*` (es. v2.0.0).

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: cartellino-unisa-macos
          - os: ubuntu-latest
            asset_name: cartellino-unisa-linux
          - os: windows-latest
            asset_name: cartellino-unisa-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Installa le dipendenze (incluso il gruppo build per PyInstaller)
        run: uv sync --group build

      - name: "Build eseguibile standalone (onedir: dist/cartellino-unisa/)"
        run: uv run pyinstaller packaging/cartellino.spec --noconfirm

      - name: Importa il certificato Developer ID in un keychain temporaneo (solo macOS)
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode -o certificate.p12
          security create-keychain -p actions-runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions-runner build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions-runner build.keychain
          rm -f certificate.p12

      - name: Firma tutte le librerie native e l'eseguibile (solo macOS)
        # `--deep` su `codesign` non attraversa una cartella onedir "piatta" come
        # quella prodotta da PyInstaller (non è un vero bundle/framework): vanno
        # firmate esplicitamente tutte le .so/.dylib prima dell'eseguibile che le usa.
        if: matrix.os == 'macos-latest'
        run: |
          find dist/cartellino-unisa -type f \( -name "*.so" -o -name "*.dylib" \) -print0 \
            | xargs -0 -I{} codesign --force --timestamp --options runtime \
                --entitlements packaging/entitlements.plist \
                --sign "Developer ID Application" {}
          codesign --force --timestamp --options runtime \
            --entitlements packaging/entitlements.plist \
            --sign "Developer ID Application" \
            dist/cartellino-unisa/cartellino-unisa
          codesign --verify --deep --strict --verbose=2 dist/cartellino-unisa/cartellino-unisa

      - name: Notarizza presso Apple (solo macOS)
        # `notarytool submit --wait` esce con codice 0 anche se Apple rifiuta la
        # richiesta (status "Invalid") — riflette solo "l'operazione CLI è
        # andata a buon fine", non l'esito della notarizzazione. Va controllato
        # esplicitamente lo status nel JSON, altrimenti uno step "verde" può
        # nascondere un binario NON notarizzato.
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/cartellino-unisa notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee notarize_result.json
          submission_id=$(jq -r '.id' notarize_result.json)
          status=$(jq -r '.status' notarize_result.json)
          echo "Notarizzazione: status=$status id=$submission_id"
          echo "--- Log dettagliato Apple (xcrun notarytool log) ---"
          xcrun notarytool log "$submission_id" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
          rm -f notarize.zip notarize_result.json
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarizzazione non accettata da Apple (status: $status) — vedi il log sopra"
            exit 1
          fi

      - name: Staple il ticket di notarizzazione (solo macOS)
        # Best-effort: se lo stapling su un eseguibile "sciolto" (non un .app/.pkg/.dmg)
        # non fosse supportato, la notarizzazione resta comunque valida — Gatekeeper
        # farà solo una verifica online al primo avvio invece che offline.
        if: matrix.os == 'macos-latest'
        run: |
          xcrun stapler staple dist/cartellino-unisa/cartellino-unisa \
            || echo "::warning::Stapling fallito, la notarizzazione resta valida (verifica online al primo avvio)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/cartellino-unisa/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Comprime ogni cartella onedir scaricata in uno zip per asset
        # I job di build girano anche su windows-latest, dove `zip` non è
        # disponibile in Git Bash: la compressione va fatta qui (ubuntu-latest,
        # `zip` sempre presente), non nei job di build.
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done
          ls -la release

      - name: Crea la GitHub Release con i binari allegati
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true
